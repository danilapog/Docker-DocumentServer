name: DocumentServer Security Scan

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Full stable release tag (empty = all configured releases)'
        type: string
        required: false
        default: ''
      edition:
        description: 'Edition to scan'
        type: choice
        options:
          - all
          - community
          - enterprise
          - developer
        default: all

permissions:
  contents: read

concurrency:
  group: documentserver-security-scan
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare stable image matrix
        id: plan
        env:
          RELEASE: ${{ inputs.release || '' }}
          EDITION: ${{ inputs.edition || 'all' }}
        run: |
          python3 .github/scripts/security-scan.py plan \
            --config .github/secure-rebuild.json \
            --release "$RELEASE" --edition "$EDITION"

  scan:
    name: Scan ${{ matrix.release }} (${{ matrix.edition }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Optional read-only Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.SECURITY_SCAN_DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            test -n "$DOCKERHUB_USERNAME"
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2
      - name: Scan both stable platform manifests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          python3 .github/scripts/security-scan.py scan --image "$IMAGE" --output reports
      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-${{ matrix.release }}-${{ matrix.edition }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
